id: health_1
name:
  en: Health 1
  ru: Здоровье 1

explanations:
  en: |
    ### Short notes about this topic

    Byuja'ni ('''بْيُوجَعْنِي''') / Btuja'ni ('''بْتُوجَعْنِي'''): The verb literally means "it causes pain to me". We attach the pronoun suffix __-ni__ ("me"). Notice gender agreement: use __byuja'ni__ for masculine body parts (__rasi__ — my head, __batni__ — my stomach) and __btuja'ni__ for feminine ones (__idi__ — my hand, __rijli__ — my leg).

    Habba ('''حَبَّة'''): Literally means "grain" or "single piece". In pharmacies, it refers to any pill, capsule, or tablet. In everyday language, it's also used as a counter for fruit or small items (e.g., __habba tuffah__ — one apple).

    Istiqbal ('''اِسْتِقْبَال'''): Derived from the verb "to receive/welcome". It is the universal term for "reception" or "front desk", used equally at a hospital admissions desk, a doctor's clinic, or a hotel lobby.

    Salamtak ('''سَلَامْتَك''') / Salamtik ('''سَلَامْتِك'''): The most essential etiquette phrase when someone is sick or injured, meaning "Get well soon!" or "Health to you!". The standard response is __Allah yisallmak__ ('''اللّٰه يْسَلْمَك''') — "May God protect you".

  ru: |
    ### Краткие заметки по этой теме

    Byuja'ni ('''بْيُوجَعْنِي''') / Btuja'ni ('''بْتُوجَعْنِي'''): Глагол буквально означает «причиняет боль [мне]». Окончание __-ни__ указывает на «меня». Обратите внимание на род: если болит часть тела мужского рода (__раси__ — моя голова, __батни__ — мой живот), говорим __byuja'ni__. Если женского (__иди__ — моя рука, __рижли__ — моя нога) — __btuja'ni__.

    Habba ('''حَبَّة'''): Дословно — «зёрнышко» или «одна штука». В аптеке обозначает любую таблетку или капсулу. В быту также часто используется как счётное слово для фруктов и мелких предметов (например, __хаббат туффах__ — одно яблоко).

    Istiqbal ('''اِسْتِقْبَال'''): От глагола «встречать / принимать». Универсальное слово: регистратура в клинике, стойка приёма в больнице или ресепшен в отеле.

    Salamtak ('''سَلَامْتَك''') / Salamtik ('''سَلَامْتِك'''): Главная этикетная фраза, когда кто-то заболел — «Выздоравливай!» / «Здоровья тебе!» (обращение к мужчине / женщине). Стандартный ответ на неё — __Allah yisallmak__ ('''اللّٰه يْسَلْمَك''') — «Пусть Бог тебя бережёт».

story:
  en:
    - ar: أَنَا بِالِاسْتِقْبَال بِالْعِيَادَة هَلَّأ. رَاسِي بْيُوجَعْنِي وِعِنْدِي حَرَارَة.
      en: I am at the reception in the clinic now. My head hurts and I have a fever.
      transliteration: "Ana bil-istiqbal bil-'iyada halla'. Rasi byuja'ni w-'indi harara."

    - ar: تَفَضَّل هُون، الْمُمَرِّضَة مَع الدَّكْتُور بِالْمُسْتَشْفَى.
      en: Come in here please, the nurse is with the doctor in the hospital.
      transliteration: "Tafaddal hon, il-mumarrida ma' id-daktoor bil-mustashfa."

    - ar: عِنْدِي جُرْح بِالإِيد، لَازِم مَرْهَم وِضِمَادَة؟
      en: I have a wound on my hand, do I need ointment and a bandage?
      transliteration: "'Indi jurh bil-id, lazim marham w-dimada?"

    - ar: إِيه، وِخُوذ هَاي الْحَبَّة لَوْ سَمَحْت. كُلّ شِي تَمَام.
      en: Yes, and take this pill please. Everything is okay.
      transliteration: "Eh, w-khud hay il-habba law samaht. Kull shi tamam."

  ru:
    - ar: أَنَا بِالِاسْتِقْبَال بِالْعِيَادَة هَلَّأ. رَاسِي بْيُوجَعْنِي وِعِنْدِي حَرَارَة.
      ru: Я сейчас на рецепции в клинике. У меня болит голова и поднялась температура.
      transliteration: "Ana bil-istiqbal bil-'iyada halla'. Rasi byuja'ni w-'indi harara."

    - ar: تَفَضَّل هُون، الْمُمَرِّضَة مَع الدَّكْتُور بِالْمُسْتَشْفَى.
      ru: Проходите сюда, пожалуйста, медсестра с врачом в больнице.
      transliteration: "Tafaddal hon, il-mumarrida ma' id-daktoor bil-mustashfa."

    - ar: عِنْدِي جُرْح بِالإِيد، لَازِم مَرْهَم وِضِمَادَة؟
      ru: У меня рана на руке, нужна мазь и бинт?
      transliteration: "'Indi jurh bil-id, lazim marham w-dimada?"

    - ar: إِيه، وِخُوذ هَاي الْحَبَّة لَوْ سَمَحْت. كُلّ شِي تَمَام.
      ru: Да, и примите эту таблетку, пожалуйста. Всё в порядке.
      transliteration: "Eh, w-khud hay il-habba law samaht. Kull shi tamam."

