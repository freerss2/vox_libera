- en: my hand itches
  ar: إِيدِي بْتِحِكَّنِي
  transliteration: "idi btihikkani"
  ru: у меня чешется рука

- en: i have a runny nose and fever
  ar: عِنْدِي رَشَح وِحَرَارَة
  transliteration: "'indi rashah w-harara"
  ru: у меня насморк и температура

- en: this is a small bruise
  ar: هَاي رَضَّة صْغِيرَة
  transliteration: "hay radda sghira"
  ru: это маленький ушиб

- en: the wound is clean
  ar: الْجُرْح نَظِيف
  transliteration: "il-jurh nazif"
  ru: рана чистая

- en: he has a leg fracture
  ar: عِنْدُو كَسِر بِالرِّجِل
  transliteration: "'indo kasir bir-rijil"
  ru: у него перелом ноги

- en: where is the bandage
  ar: وِين الضِّمَادَة؟
  transliteration: "wen id-dimada?"
  ru: где повязка

- en: take this pill please
  ar: خُوذ هَاي الْحَبَّة لَوْ سَمَحْت
  transliteration: "khud hay il-habba law samaht"
  ru: выпей эту таблетку пожалуйста

- en: i need an ointment for the hand
  ar: بِدِّي مَرْهَم لِلإِيد
  transliteration: "biddi marham lil-id"
  ru: мне нужна мазь для руки

- en: where are the eye drops
  ar: وِين قَطْرَة الْعَيْن؟
  transliteration: "wen qatrat il-'ayn?"
  ru: где глазные капли

- en: the doctor is inside the clinic
  ar: الدَّكْتُور جَوَّا الْعِيَادَة
  transliteration: "id-daktoor jawwa il-'iyada"
  ru: врач внутри клиники

- en: the nurse is at the reception
  ar: الْمُمَرِّضَة بِالِاسْتِقْبَال
  transliteration: "il-mumarrida bil-istiqbal"
  ru: медсестра в регистратуре

- en: this hospital is big
  ar: هَاد الْمُسْتَشْفَى كْبِير
  transliteration: "had il-mustashfa kbir"
  ru: эта больница большая

- en: my stomach hurts
  ar: بَطْنِي بْيُوجَعْنِي
  transliteration: "batni byuja'ni"
  ru: у меня болит живот

- en: where is the pharmacy
  ar: وِين الصَّيْدَلِيَّة؟
  transliteration: "wen is-saydaliyya?"
  ru: где аптека

- en: i have a cough and sore throat
  ar: عِنْدِي قَحَّة وِوَجَع بِالْحَلْق
  transliteration: "'indi qahha w-waj'a bil-halq"
  ru: у меня кашель и болит горло

- en: do you have medicine for headache
  ar: عِنْدَك دَوَا لِوَجَع الرَّاس؟
  transliteration: "'indak dawa li-waj'a ir-ras?"
  ru: у вас есть лекарство от головной боли

- en: i feel dizzy today
  ar: أَنَا دَايِخ الْيَوْم
  transliteration: "ana dayikh il-yom"
  ru: у меня сегодня кружится голова

- en: call the ambulance please
  ar: اِتَّصِل بِالإِسْعَاف لَوْ سَمَحْت
  transliteration: "ittasil bil-is'af law samaht"
  ru: вызовите скорую пожалуйста

- en: everything is fine thank God
  ar: كُلّ شِي تَمَام الْحَمْدُ لِلّٰه
  transliteration: "kull shi tamam il-hamdu lillah"
  ru: всё в порядке слава Богу
