explanations:
  en: |
    ### Hello! Welcome to the Conversational Arabic (Levantine) course.
    The goal of the course is to develop a solid **basic vocabulary** necessary for everyday communication and understanding of everyday speech, as well as to master some grammar rules and sentence structures.

    The course is designed for students at levels **A0-A1** who are already familiar with the alphabet and reading rules.
    The program and course texts are structured using **artificial intelligence** technologies, which allowed us to select the most relevant and frequent language structures.

    On this screen, you can select the interface language. To save this and other settings, as well as track your learning progress, you can connect your Google account.

  ru: |
    ### Здравствуйте! Добро пожаловать на курс разговорного арабского языка (левантийский диалект)
    Цель курса — сформировать устойчивый **базовый лексикон**, необходимый для повседневного общения и понимания обиходной речи, а также освоить некоторые грамматические правила и конструкции предложения.

    Курс ориентирован на учащихся уровня **A0-A1**, уже знакомых с алфавитом и правилами чтения.
    Программа и учебные тексты структурированы с применением технологий **искусственного интеллекта**, что позволило отобрать наиболее актуальные и частотные языковые конструкции.

    На этом экране вы можете выбрать язык интерфейса. Для сохранения этой и других настроек, а также прогресса обучения, можно подключить свой Google-аккаунт.

