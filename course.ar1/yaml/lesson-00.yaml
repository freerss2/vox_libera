explanations:
  en: |
    ### ### Welcome to the course on living Arabic (Levantine dialect)!

    Conversational Arabic is something often missing from classic textbooks and popular apps, but it opens the door to real communication. Our goal is not to memorize dry theory, but to give you a foundation that really works in real life. We'll build a solid vocabulary for everyday situations and easily cover grammar, so you can understand native speakers and speak confidently.

    The course is ideal for beginners (levels **A0-A1**) who already know the alphabet and can read.

    To avoid wasting time on outdated, word-for-word phrases, the learning materials are **compiled using AI** — we've selected only the most relevant and common expressions in modern speech. I always welcome feedback: if you have ideas on how to improve the lessons, don't hesitate to contact us!

    On this screen, you can select the interface language. To securely sync your settings and progress via your Google Drive, simply connect your account.

  ru: |
    ### Добро пожаловать на курс живого арабского языка (левантийский диалект)!

    Разговорный арабский — это то, чего часто не хватает в классических учебниках и популярных приложениях, но именно он открывает двери к настоящему общению. Наша цель — не зубрить сухую теорию, а дать вам базу, которая реально работает в жизни. Мы соберем прочный словарный запас для повседневных ситуаций и легко разберем грамматику, чтобы вы понимали носителей и могли уверенно говорить сами.

    Курс идеально подойдет для начинающих (уровень **A0-A1**), которые уже знают алфавит и умеют читать.

    Чтобы вы не тратили время на устаревшие книжные фразы, учебные материалы **собраны с помощью ИИ** — мы отобрали только самые актуальные и частотные выражения современной речи. Я всегда рад обратной связи: если у вас есть идеи, как сделать уроки лучше, смело пишите!

    На этом экране вы можете выбрать язык интерфейса. А чтобы ваши настройки и прогресс надежно синхронизировались через ваш Google Drive, просто подключите свой аккаунт.

