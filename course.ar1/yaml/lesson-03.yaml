sentences:
- en: the carpet is on the floor
  ar: السَّجَّادَة عَ الْأَرْض
  transliteration: "as-sajjada 'a-l-ard"
  ru: ковёр лежит на полу
- en: the wardrobe is in the room
  ar: الْخِزَانَة بِالْغُرْفَة
  transliteration: il-khizane bil-ghurfa
  ru: шкаф стоит в комнате
- en: the bed is big and comfortable
  ar: التَّخْت كْبِير وِمْرِيح
  transliteration: it-takht kbir w-mrih
  ru: кровать большая и удобная
- en: this bedroom is very bright
  ar: هَاي غُرْفَة النَّوْم مْنَوَّرَة كْتِير
  transliteration: hayy ghurfat in-nom mnawwara ktir
  ru: эта спальня очень светлая
- en: the kitchen window is open
  ar: شُبَّاك الْمَطْبَخ مَفْتُوح
  transliteration: shubbak il-matbakh maftuh
  ru: окно на кухне открыто
- en: the ceiling is white and high
  ar: السَّقِف أَبْيَض وِعَالِي
  transliteration: "is-saqif abyad w-'ali"
  ru: потолок белый и высокий
- en: every day i wake up early
  ar: كُلّ يَوْم بِفِيق بَكِّير
  transliteration: kull yom bfiq bakkir
  ru: каждый день я просыпаюсь рано
- en: i drink coffee with milk
  ar: بِشْرَب قَهْوَة مَع حَلِيب
  transliteration: "bishrab qahwa ma' halib"
  ru: я пью кофе с молоком
- en: where is the car key
  ar: وِين مِفْتَاح السَّيَّارَة؟
  transliteration: wen miftah as-sayyara?
  ru: где ключ от машины
- en: the keys are on the table
  ar: الْمَفَاتِيح عَ الطَّاوْلَة
  transliteration: "al-mafatih 'a-t-tawle"
  ru: ключи на столе
- en: i eat breakfast in the kitchen
  ar: بَاكُل فْطُور بِالْمَطْبَخ
  transliteration: bakul ftur bil-matbakh
  ru: я завтракаю на кухне
- en: the tap is in the kitchen
  ar: الْحَنَفِيَّة بِالْمَطْبَخ
  transliteration: il-hanafiyya bil-matbakh
  ru: кран на кухне
- en: i am going to the bedroom
  ar: بَرُوح عَ غُرْفَة النَّوْم
  transliteration: "baruh 'a-ghurfat in-nom"
  ru: я иду в спальню
- en: there is a window in the room
  ar: فِيه شُبَّاك بِالْغُرْفَة
  transliteration: fih shubbak bil-ghurfa
  ru: в комнате есть окно
- en: the money is in the bag
  ar: الْمَصَارِي بِالشَّنْطَة
  transliteration: il-masari bish-shanta
  ru: деньги в сумке
- en: i must go to work now
  ar: لَازِم رُوح عَ الشُّغُل هَلَّأ
  transliteration: "lazim ruh 'a-sh-shughul halla'"
  ru: я должен идти на работу сейчас
- en: i always drink water in the evening
  ar: دَائِمَاً بِشْرَب مَيّ الْمَسَا
  transliteration: "da'iman bishrab mayy il-masa"
  ru: я всегда пью воду вечером
- en: she eats breakfast and drinks milk
  ar: بِتَاكُل فْطُور وِبِتِشْرَب حَلِيب
  transliteration: bitakul ftur w-bitishrab halib
  ru: она завтракает и пьёт молоко
- en: i also work every day
  ar: أَنَا كَمَان بَشْتِغِل كُلّ يَوْم
  transliteration: ana kaman bashtighil kull yom
  ru: я тоже работаю каждый день
- en: i drink water every day
  ar: بِشْرَب مَيّ كُلّ يَوْم
  transliteration: bishrab mayy kull yom
  ru: я пью воду каждый день