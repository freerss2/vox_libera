id: everyday_life_1
name:
  en: Everyday life 1
  ru: Быт и обиход 1
explanations:
  en: |
    This lesson will help us describe everyday objects that surround us.
    Note that the **passive voice** is sometimes used to construct **adjectives**.
    The passive voice construction model looks like this:
    [mu-1-2i-3] where 1, 2, and 3 are the letters of the root, for example [munir] '''منير'''

    ### Colloquial use of the preposition of direction
    In colloquial Levantine, the short preposition '''عَ''' ('a) is a contraction of the classical '''عَلَى''' ('ala - "on"). 
    It is used not only to indicate a location (where?), but also completely replaces the literary '''إِلَى''' ('ila) when indicating the direction of movement (where?). 
    In living speech, '''عَ''' always merges with the following word and its article: for example, '''عَ الطَّاوْلَة''' ('a-t-tavle - "on the table") or '''عَ الشُّغُل''' ('a-sh-shugul - “on work").

  ru: |
    Этот урок поможет нам описать бытовые предметы окружающие нас в повседневной жизни.
    Обратите внимание на то, что для построения **прилагательного** иногда используется **пассивный залог**.
    Модель построения пассивного залога выглядит так:
    [mu-1-2i-3] где 1, 2 и 3 - буквы корня, например [munir] '''منير'''

    ### Разговорное употребление предлога направления
    В разговорном левантийском диалекте короткий предлог '''عَ''' ('a) — это сокращение от классического '''عَلَى''' ('ala — «на»). 
    Он используется не только для указания местоположения (где?), но и полностью заменяет литературное '''إِلَى''' ('ila) при указании направления движения (куда?). 
    В живой речи '''عَ''' всегда сливается со следующим словом и его артиклем: например, '''عَ الطَّاوْلَة''' (‘а-т-тавле — «на столе») или '''عَ الشُّغُل''' (‘а-ш-шугуль — «на работу»).

story:
  en:
  - ar: كُلّ يَوْم بِفِيق بَكِّير وِبِشْرَب قَهْوَة.
    en: Every day I wake up early and drink coffee.
    transliteration: Kull yom bfiq bakkir w-bishrab qahwa.
  - ar: وِين مَفَاتِيح السَّيَّارَة؟ لَازِم رُوح عَ الشُّغُل هَلَّق.
    en: Where are the car keys? I must go to work now.
    transliteration: Wen mafatih as-sayyara? Lazim ruh a-sh-shughul hallaq.
  - ar: الْمَفَاتِيح عَ الطَّاوْلَة بِالْمَطْبَخ يَا حَبِيبِي.
    en: The keys are on the table in the kitchen, my dear.
    transliteration: Al-mafatih a-t-tawle b-il-matbakh ya habibi.
  - ar: شُكْراً! جَارِي كَمَان بِيرُوح عَ الشُّغُل بِنَفْس الْوَقْت.
    en: Thanks! My neighbor also goes to work at the same time.
    transliteration: Shukran! Jari kaman biruh a-sh-shughul b-nafs al-waqt.
  - ar: بِتَاكُل فْطُور قَبِل مَا تْرُوح؟
    en: Do you eat breakfast before you go?
    transliteration: Btakul ftur qabil ma truh?
  - ar: لَا، أَنَا مِش جُوعَان، بَس تَعْبَان شْوَي.
    en: No, I am not hungry, just a bit tired.
    transliteration: La, ana mish juan, bas taban shway.
  - ar: الله مَعَك! بِشُوفَك الْمَسَا بِالْبِيت.
    en: May God be with you! See you in the evening at home.
    transliteration: Allah maak! Bshufak al-masa b-il-bet.
  ru:
  - ar: كُلّ يَوْم بِفِيق بَكِّير وِبِشْرَب قَهْوَة.
    ru: Каждый день я просыпаюсь рано и пью кофе.
    transliteration: Kull yom bfiq bakkir w-bishrab qahwa.
  - ar: وِين مَفَاتِيح السَّيَّارَة؟ لَازِم رُوح عَ الشُّغُل هَلَّق.
    ru: Где ключи от машины? Мне пора на работу.
    transliteration: Wen mafatih as-sayyara? Lazim ruh a-sh-shughul hallaq.
  - ar: الْمَفَاتِيح عَ الطَّاوْلَة بِالْمَطْبَخ يَا حَبِيبِي.
    ru: Ключи лежат на столе на кухне, дорогой.
    transliteration: Al-mafatih a-t-tawle b-il-matbakh ya habibi.
  - ar: شُكْراً! جَارِي كَمَان بِيرُوح عَ الشُّغُل بِنَفْس الْوَقْت.
    ru: Спасибо! Мой сосед тоже ходит на работу в это же время.
    transliteration: Shukran! Jari kaman biruh a-sh-shughul b-nafs al-waqt.
  - ar: بِتَاكُل فْطُور قَبِل مَا تْرُوح؟
    ru: Ты завтракаешь перед тем, как идти?
    transliteration: Btakul ftur qabil ma truh?
  - ar: لَا، أَنَا مِش جُوعَان، بَس تَعْبَان شْوَي.
    ru: Нет, я не голоден, просто немного устал.
    transliteration: La, ana mish juan, bas taban shway.
  - ar: الله مَعَك! بِشُوفَك الْمَسَا بِالْبِيت.
    ru: С Богом! Увидимся вечером дома.
    transliteration: Allah maak! Bshufak al-masa b-il-bet.

