sentences:

- ar: أَبوي ساكِن بِحَيْفا
  en: My father lives in Haifa
  transliteration: abuy sakin b-Hefa
  ru: Мой отец живет в Хайфе

- ar: جَدّي عُمْره خَمْسة وَسَبْعين سَنة
  en: My grandfather is 75 years old
  transliteration: "jiddi 'umro khamse w saba'in sene"
  ru: Моему деду 75 лет

- ar: سِتّي خِلْقِت بْيافا
  en: My grandmother was born in Jaffa
  transliteration: "sitti khil'it b-Yafa"
  ru: Моя бабушка родилась в Яффе

- ar: أَخوي مِتْجَوِّز
  en: My brother is married
  transliteration: akhuy mitjawwiz
  ru: Мой брат женат

- ar: إِخْتي مِتْجَوِّزة وَعِنْدها وَلَدَيْن
  en: My sister is married and has two kids
  transliteration: "ikhti mitjawwze w 'indha waladein"
  ru: Моя сестра замужем, у нее двое детей

- ar: تْجَوَّز السَّنة الماضْية
  en: He got married last year
  transliteration: tjawwaz is-sene il-madye
  ru: Он женился в прошлом году

- ar: بِنْتي عُمْرهَا خَمَس سْنين وَإِبْني عُمْره ثْماني
  en: My daughter is 5 and my son is 8
  transliteration: "binti 'umrha khamas snin w ibni 'umro tmane"
  ru: Моей дочке 5 лет, а сыну 8

- ar: حَماتي ساكْنة مَعْنا، كِلّنا مِنْجْتَمَع عِنْد سِتّي كِلّ جُمْعَة
  en: "My mother-in-law lives with us, we all gather at grandma's every Friday"
  transliteration: "hamati sakne ma'na, killna minijtama' 'ind sitti kill jum'a"
  ru: Моя теща живет с нами, мы все собираемся у бабушки по пятницам

- ar: قَدّيش وَلاد عِنْد أَخوك؟
  en: How many kids does your brother have?
  transliteration: "qaddesh wlad 'ind akhuk?"
  ru: Сколько детей у твоего брата?

- ar: عِنْد أَخوي ثْلاث وَلاد
  en: My brother has three kids
  transliteration: "'ind akhuy tlat wlad"
  ru: У моего брата трое детей

- ar: وَيْن ساكِن إِبْنك الكْبير؟
  en: Where does your eldest son live?
  transliteration: wein sakin ibnak il-kbir?
  ru: Где живет твой старший сын?

- ar: إِبْني الكْبير ساكِن بِتَلّ أَبِيب
  en: My eldest son lives in Tel Aviv
  transliteration: ibni il-kbir sakin b-Tall Abib
  ru: Мой старший сын живет в Тель-Авиве

- ar: كان عِنْد جَدّك إِخْوة وَأَخَوات؟
  en: Did your grandpa have brothers and sisters?
  transliteration: "kan 'ind jaddak ikhwe w akhawat?"
  ru: У твоего деда были братья и сестры?

- ar: إيه، كان عِنْد جَدّي أَخَوَيْن وَإِخِت
  en: Yes, my grandpa had two brothers and a sister
  transliteration: "eh, kan 'ind jiddi akhawein w ikhit"
  ru: Да, у моего деда было два брата и сестра

- ar: مَرْتك مِن وَيْن أَصِلها؟
  en: Where is your wife originally from?
  transliteration: martak min wein asilha?
  ru: Твоя жена откуда родом?

- ar: مَرْتي أَصِلها مِن بَيْروت
  en: My wife is originally from Beirut
  transliteration: marti asilha min Beirut
  ru: Моя жена родом из Бейрута

- ar: قَدّيش عُمُر إِمَّك؟
  en: How old is your mom?
  transliteration: "qaddesh 'umur immak?"
  ru: Сколько лет твоей маме?

- ar: إِمّي عُمْرهَا خَمْسة وَخَمْسين سَنة
  en: My mom is 55 years old
  transliteration: "immi 'umrha khamse w khamsin sene"
  ru: Моей маме 55 лет

- ar: إِنْت مِتْجَوِّز؟
  en: Are you married?
  transliteration: inta mitjawwiz?
  ru: Ты женат?

- ar: لا، أَنا عازِب، بَسّ أَخوي مِتْجَوِّز مِن خَمَس سْنين
  en: "No, I'm single, but my brother has been married for five years"
  transliteration: "la, ana 'azib, bass akhuy mitjawwiz min khamas snin"
  ru: Нет, я холост, а брат женат уже пять лет

story:

  en:

    - ar: "إِسْمي أَحْمَد، أَنا ساكِن بْعَكّا، بَسّ أَصْلي مِن النّاصْرة"
      en: "My name is Ahmad, I live in Akko, but I'm originally from Nazareth"
      transliteration: "ismi Ahmad, ana sakin b-'Akka, bass asli min in-Nasra"
    
    - ar: "أَبوي عُمْره إِثْنَيْن وَسِتّين وَإِمّي عُمْرهَا ثْمانة وَخَمْسين، هِنّي ساكْنين بِنابْلُس"
      en: "My father is 62 and my mother is 58, they live in Nablus"
      transliteration: "abuy 'umro itnein w sittin w immi 'umrha tmane w khamsin, hinni saknin b-Nablus"
  
    - ar: "سِتّي خِلْقِت بِسَنة إِثْنَيْن وَخَمْسين بِالقُدْس، هَلّأ عُمْرهَا إِثْنَيْن وَسَبْعين"
      en: "My grandmother was born in 1952 in Jerusalem, now she is 72"
      transliteration: "sitti khil'it bi-sene itnein w khamsin bil-Quds, halla 'umrha itnein w saba'in"
    
    - ar: "أَخوي الكْبير تْجَوَّز مِن سَنْتَيْن، مَرْته أَصِلها مِن طْرابْلُس"
      en: "My eldest brother got married two years ago, his wife is originally from Tripoli"
      transliteration: "akhuy il-kbir tjawwaz min santein, marto asilha min Trablous"
  
    - ar: "هَلّأ عِنْدهُن صَبي، عُمْره سَنْتَيْن"
      en: "Now they have a baby boy, he is two years old"
      transliteration: "halla 'indhun sabi, 'umro santein"
    
    - ar: "كِلّنا مِنْجْتَمَع عِنْد أَبوي وَإِمّي كِلّ سَبِت"
      en: "We all gather at my parents' place every Saturday"
      transliteration: "killna minijtama' 'ind abuy w immi kill sabit"

  ru:
    - ar: "إِسْمي أَحْمَد، أَنا ساكِن بْعَكّا، بَسّ أَصْلي مِن النّاصْرة"
      transliteration: "ismi Ahmad, ana sakin b-'Akka, bass asli min in-Nasra"
      ru: "Меня зовут Ахмад, я живу в Акко, но родом из Назарета"
    
    - ar: "أَبوي عُمْره إِثْنَيْن وَسِتّين وَإِمّي عُمْرهَا ثْمانة وَخَمْسين، هِنّي ساكْنين بِنابْلُس"
      transliteration: "abuy 'umro itnein w sittin w immi 'umrha tmane w khamsin, hinni saknin b-Nablus"
      ru: "Моему отцу 62, а маме 58, они живут в Наблусе"
  
    - ar: "سِتّي خِلْقِت بِسَنة إِثْنَيْن وَخَمْسين بِالقُدْس، هَلّأ عُمْرهَا إِثْنَيْن وَسَبْعين"
      transliteration: "sitti khil'it bi-sene itnein w khamsin bil-Quds, halla 'umrha itnein w saba'in"
      ru: "Моя бабушка родилась в 1952 году в Иерусалиме, ей сейчас 72"
    
    - ar: "أَخوي الكْبير تْجَوَّز مِن سَنْتَيْن، مَرْته أَصِلها مِن طْرابْلُس"
      transliteration: "akhuy il-kbir tjawwaz min santein, marto asilha min Trablous"
      ru: "Мой старший брат женился два года назад, его жена родом из Триполи"
  
    - ar: "هَلّأ عِنْدهُن صَبي، عُمْره سَنْتَيْن"
      transliteration: "halla 'indhun sabi, 'umro santein"
      ru: "Теперь у них мальчик, ему 2 года"
    
    - ar: "كِلّنا مِنْجْتَمَع عِنْد أَبوي وَإِمّي كِلّ سَبِت"
      transliteration: "killna minijtama' 'ind abuy w immi kill sabit"
      ru: "Мы все собираемся у родителей каждую субботу"
