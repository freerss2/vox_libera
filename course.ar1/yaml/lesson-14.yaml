id: describe_family_1
name:
  en: Tell about your family
  ru: Рассказ о семье


explanations:
  en: |
    ### Family in Levantine - 3 hacks

    Family vocab in Levantine is built on three shortcuts.

    **1. Possessives are one word.** We don't say `ab + i`. We say **abuy** ('''أَبوي''') — my father, **immi** ('''إِمّي''') — my mother. Same for **jiddi** ('''جَدّي'''), **sitti** ('''سِتّي'''), **akhuy** ('''أَخوي'''), **ikhti** ('''إِخْتي'''). Learn them as a whole.

    **2. Age is "my age".** There is no verb "I am 30". You say **'umri** ('''عُمْري''') 30 — literally "my age is 30". For others **'umro** ('''عُمْره''') 70 — "his age is 70". Same model as **'indi** ('''عِنْدي''') — I have.

    **3. The flip.** MSA **mutazawwij** ('''مُتَزَوِّج''') — married, becomes **mitjawwiz** ('''مِتْجَوِّز''') in Levantine. Letters `ز` and `ج` swapped. That's why **jozi** ('''جَوْزي''') means my husband, but **joz** ('''جَوْز''') also means walnut. Context saves you.


  ru: |
    ### Семья в левантийском — 3 хака

    Вся семейная лексика держится на трех приемах.

    **1. Притяжательность — одним словом.** Мы не говорим '''أب + ي'''. Говорим **abuy** ('''أَبوي''') — мой отец, **immi** ('''إِمّي''') — моя мама. Так же **jiddi** ('''جَدّي'''), **sitti** ('''سِتّي'''), **akhuy** ('''أَخوي'''), **ikhti** ('''إِخْتي'''). Учи сразу целиком.

    **2. Возраст — это "мой возраст".** Нет "мне 30 лет". Говорят **'umri** ('''عُمْري''') 30 — букв. "мой возраст 30". Про другого **'umro** ('''عُمْره''') 70 — "его возраст 70". Та же модель что и **'indi** ('''عِنْدي''') — у меня есть.

    **3. Перевертыш.** Фусха **mutazawwij** ('''مُتَزَوِّج''') — женат, в Леванте **mitjawwiz** ('''مِتْجَوِّز'''). Буквы '''ز''' и '''ج''' поменялись местами, отсюда **jozi** ('''جَوْزي''') — мой муж, но **joz** ('''جَوْز''') — еще и грецкий орех. Спасает контекст.

