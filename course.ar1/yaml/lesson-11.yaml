id: local_market
name:
  en: At the Market
  ru: На рынке
explanations:
  en: |
    ### Important notes about this topic

    Ittafaqna ('''اتفقنا'''): A verb in the past tense ("we agreed"), but used specifically as "OK, it's done."

    Mish mihriz ('''مش محرز'''): A super-popular Levantine expression. It means "it's not worth it," "it has no value," "it's not worth it." If you're offered a two-cent discount, say "mish mihriz" without hesitation.

    Basta ('''بسطة'''): This isn't just a stall, but most often an improvised street stand, a folding cot, or a carpet on the ground from which people sell fruit or souvenirs.

    Bahdalah ('''بهدلة'''): A very capacious word. It can mean "outrage," "reprimand/scolding," and "utter chaos."

    Harban ('''خربان'''): The most common colloquial word for something that is damaged, broken, or defective (from a telephone to sour milk).

  ru: |
    ### Важные замечания по поводу этой темы

    Ittafaqna ('''اتفقنا'''): Глагол в прошедшем времени («мы договорились»), но используется именно как «ОК, идёт, по рукам».

    Миш михриз ('''مش محرز'''): Супер-популярное левантийское выражение. Означает «оно того не стоит», «не имеет ценности», «невыгодно». Если вам предлагают скидку в два цента, смело говорите «mish mihriz».

    Баста ('''بسطة'''): Это не просто прилавок, а чаще всего импровизированный уличный лоток, раскладушка или ковер на земле, с которого продают фрукты или сувениры.

    Бахдаля ('''بهدلة'''): Очень емкое слово. Это и «безобразие», и «выговор/нагоняй», и «полный хаос».

    Харбан ('''خربان'''): Самое ходовое разговорное слово для обозначения чего-то испорченного, сломанного или бракованного (от телефона до прокисшего молока).

story:
  en:
    - ar: مَرْحَبَا يَا بَيَّاع، شُو سِعِر هَاي الشَّنْطَة عَ الْبَسْطَة؟
      en: Hi seller, how much is this bag on the stall?
      transliteration: "Marhaba ya bayya', shu si'ir hay ash-shanta 'al-basta?"

    - ar: أَهْلًا وَسَهْلًا! هَاي مِش أَيَّ شَنْطَة، هَاي جِلْد أَصْلِي وِشُغُل إِيد، أَحْلَى بْضَاعَة عِنْدِي.
      en: Welcome! This is not just any bag, it's real leather, handmade, my best item.
      transliteration: "Ahla w-sahla! Hay mish ayy shanta, hay jild asli w-shughul id, ahla bda'a 'andi."

    - ar: سِعِرْهَا مْنِيح، نَوْعِيَّتْهَا مُمْتَازَة مِش تَقْلِيد.
      en: Its price is fair, its quality is excellent, not a fake.
      transliteration: "Si'irha mnih, no'iyyatha mumtaze mish taqlid."

    - ar: شُو هَالْحَكِي! هَاد غَالِي كْتِير، عَيْب عَلَيْك. بِدِّي خَصِم كْبِير.
      en: What are you saying! This is way too expensive. I want a big discount.
      transliteration: "Shu hal-haki! Had ghali ktir, 'eb 'aleik. Biddi khasim kbir."

    - ar: وَاللّٰه عَمْ تِظْلِمِينِي، تِطَّلَّعِي عَ الْخِيَاطَة، بِتِضَلّ مَعِك عَشِر سْنِين.
      en: You're being unfair, look at the stitching, it will last you ten years.
      transliteration: "Walla 'am tizlimini, tittalla'i 'al-khiyata, bitidall ma'ik 'ashir snin."

    - ar: لَازِم الْوَاحِد يْفَاصِل دَايْمًا بِالسُّوق؟ طَيِّب، اِتَّفَقْنَا.
      en: Does one always have to bargain at the market? Okay, deal.
      transliteration: "Lazim il-wahad yfasil dayman bis-suq? Tayyib, ittafaqna."

  ru:
    - ar: مَرْحَبَا يَا بَيَّاع، شُو سِعِر هَاي الشَّنْطَة عَ الْبَسْطَة؟
      ru: Привет, продавец, почём эта сумка на прилавке?
      transliteration: "Marhaba ya bayya', shu si'ir hay ash-shanta 'al-basta?"

    - ar: أَهْلًا وَسَهْلًا! هَاي مِش أَيَّ شَنْطَة، هَاي جِلْد أَصْلِي وِشُغُل إِيد، أَحْلَى بْضَاعَة عِنْدِي.
      ru: Добро пожаловать! Это не просто сумка, это натуральная кожа, ручная работа, лучший товар у меня.
      transliteration: "Ahla w-sahla! Hay mish ayy shanta, hay jild asli w-shughul id, ahla bda'a 'andi."

    - ar: سِعِرْهَا مْنِيح، نَوْعِيَّتْهَا مُمْتَازَة مِش تَقْلِيد.
      ru: Цена нормальная, качество отличное, не подделка.
      transliteration: "Si'irha mnih, no'iyyatha mumtaze mish taqlid."

    - ar: شُو هَالْحَكِي! هَاد غَالِي كْتِير، عَيْب عَلَيْك. بِدِّي خَصِم كْبِير.
      ru: Что ты такое говоришь! Это очень дорого. Хочу большую скидку.
      transliteration: "Shu hal-haki! Had ghali ktir, 'eb 'aleik. Biddi khasim kbir."

    - ar: وَاللّٰه عَمْ تِظْلِمِينِي، تِطَّلَّعِي عَ الْخِيَاطَة، بِتِضَلّ مَعِك عَشِر سْنِين.
      ru: Честно, ты меня обижаешь, посмотри на строчку, она прослужит тебе десять лет.
      transliteration: "Walla 'am tizlimini, tittalla'i 'al-khiyata, bitidall ma'ik 'ashir snin."

    - ar: لَازِم الْوَاحِد يْفَاصِل دَايْمًا بِالسُّوق؟ طَيِّب، اِتَّفَقْنَا.
      ru: Надо всегда торговаться на рынке? Ладно, договорились.
      transliteration: "Lazim il-wahad yfasil dayman bis-suq? Tayyib, ittafaqna."

sentences:
- en: what is the price of this
  ar: شُو سِعِر هَاد؟
  transliteration: "shu si'ir had?"
  ru: какая цена у этого

- en: i want a big discount
  ar: بِدِّي خَصِم كْبِير
  transliteration: "biddi khasim kbir"
  ru: я хочу большую скидку

- en: it is necessary to bargain at the market
  ar: لَازِم تْفَاصِل بِالسُّوق
  transliteration: "lazim tfasil bis-suq"
  ru: на рынке нужно торговаться

- en: everything on the stall is clean
  ar: كُلّ شِي عَ الْبَسْطَة نَظِيف
  transliteration: "kull shi 'al-basta nazif"
  ru: всё на прилавке чистое

- en: the seller is a good man
  ar: الْبَيَّاع زَلَمَة طَيِّب
  transliteration: "al-bayya' zalame tayyib"
  ru: продавец хороший человек

- en: shame on you this is too expensive
  ar: عَيْب عَلَيْك هَاد غَالِي كْتِير
  transliteration: "'eb 'aleik had ghali ktir"
  ru: как не стыдно это слишком дорого

- en: this price is a robbery
  ar: هَاد السِّعِر سِرْقَة
  transliteration: "had as-si'ir sirqa"
  ru: эта цена грабёж

- en: this job is not worth it
  ar: هَاد الشُّغُل مِش مِحْرِز
  transliteration: "had ash-shughul mish mihriz"
  ru: эта работа не стоит того

- en: what a mess is here
  ar: شُو هَالْبَهْدَلَة هُون
  transliteration: "shu hal-bahdala hon"
  ru: что за безобразие здесь

- en: the food is high quality
  ar: الأَكِل جَوْدَة عَالْيَة
  transliteration: "al-akil jawda 'alya"
  ru: еда качественная

- en: the phone is broken
  ar: التَّلَفُون خَرْبَان
  transliteration: "at-talafon kharban"
  ru: телефон бракованный

- en: this bag is fake
  ar: هَاي الشَّنْطَة تَقْلِيد
  transliteration: "hay ash-shanta taqlid"
  ru: эта сумка поддельная

- en: give me a better price please
  ar: أَعْطِينِي سِعِر أَحْسَن لَوْ سَمَحْت
  transliteration: "a'tini si'ir ahsan law samaht"
  ru: дай мне цену получше пожалуйста

- en: is this real leather
  ar: هَاد جِلْد أَصْلِي؟
  transliteration: "had jild asli?"
  ru: это натуральная кожа

- en: this bag is very cheap
  ar: هَاي الشَّنْطَة رَخِيصَة كْتِير
  transliteration: "hay ash-shanta rakhisa ktir"
  ru: эта сумка очень дешёвая

- en: i want to buy handmade items
  ar: بِدِّي أَشْتَرِي شُغُل إِيد
  transliteration: "biddi ashtari shughul id"
  ru: я хочу купить вещи ручной работы

- en: the goods on the stall are excellent
  ar: الْبْضَاعَة عَ الْبَسْطَة مُمْتَازَة
  transliteration: "al-bda'a 'al-basta mumtaza"
  ru: товар на прилавке отличный

- en: i do not want fake goods
  ar: مَا بِدِّي بْضَاعَة تَقْلِيد
  transliteration: "ma biddi bda'a taqlid"
  ru: я не хочу поддельный товар

- en: how much is this bag
  ar: قَدَّايْش هَاي الشَّنْطَة؟
  transliteration: "qaddesh hay ash-shanta?"
  ru: сколько стоит эта сумка

- en: we agreed on the price
  ar: اِتَّفَقْنَا عَ السِّعِر
  transliteration: "ittafaqna 'as-si'ir"
  ru: мы договорились о цене

