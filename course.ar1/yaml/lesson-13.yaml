id: supermarket_1
name:
  en: In the supermarket
  ru: В супермаркете



explanations:
  en: |
    ### Short notes about this topic

    **Numbers are words, not digits.** In this lesson all numbers are written out in Arabic — '''عَشَر''', '''إثْنَعْشَر''', '''ميتَيْن''' — so you learn to pronounce and understand them, not just to read 10, 12, 200. In Levantine, teens are fused: '''إثْنَعْشَر''' __itna'shar__ (12), '''أَرْبَعْطَعْشَر''' __arba'tashar__ (14), '''تْمَنْطَعْشَر''' __tmantashar__ (18). Tens are built as unit + w + ten: '''خَمْسة وَعِشْرين''' __khamse w 'ishrin__ (25), '''سَبْعة وَتْمانين''' __saba' w tmanin__ (87). Hundreds: '''مِيّة''' __miyye__ (100), '''ميتَيْن''' __mitein__ (200), '''ثْلاثْمِيّة''' __tlat-miyye__ (300), '''أَرْبَعْمِيّة''' __arba'-miyye__ (400).
    **Cheaper / more expensive.** '''أَرْخَص''' __arkhas__ and '''أَغْلى''' __aghla__ are comparatives. The pattern is:
    '''هاد الجِّبْنة أَرْخَص بِـ عَشَر لِيرة''' __had il-jibne arkhas bi-'ashar lira__ — This cheese is cheaper by 10 lira.
    The '''بِـ''' __bi-__ is important: it means by this amount.
    **Weigh me.** '''إِوْزِنّي''' __wzinni__ = weigh + for me. Levantine imperative + -ni (for me) is very common in a shop: '''عْطيني''' __'tini__ (give me), '''إِوْزِنّي''' __wzinni__ (weigh for me).
    **Slice or leave it?** '''أَقَطِّعْها رْفيع وَلّا أُتْرُكْها شَقْفة؟''' __aqatti'ha rfi' walla atrukha sha'fe?__ — Do I slice it thin or leave it as a piece? '''شَقْفة''' __sha'fe__ is the everyday word for a chunk / piece of cheese, meat, bread.
    **Expiry.** Two ways to say it:
    - '''تاريخ الانْتِهاء''' __tarikh il-intiha__ — expiry date, formal, on the label
    - '''بْيِخْلَص بُكْرا''' __byikhlas bukra__ — it finishes / expires tomorrow, spoken
    '''بْيِضَلّ إثْنَعْشَر يَوْم''' __bidall itna'shar yom__ = it stays good for 12 more days.
    **Paying.** '''المَجْموع''' __il-majmu'__ = the total. '''حَقّه''' __ha''o__ = its price. '''بِالبِطاقة''' __bil-bitaqa__ = by card, '''كاش''' __cash__ = cash. If the card fails: '''بِطاقْتي ما عَم بِتْمْرُق''' __bita'ti ma 'am bitmru'__ — my card is not going through. If the discount didn't apply: '''الخَصِم ما نِزِل''' __il-khusum ma nizil__ — the discount didn't come down / didn't apply.


  ru: |
    ### Коротко о теме

    **Числа — прописью, а не цифрами.** В этом уроке все числа в арабском варианте написаны словами — '''عَشَر''', '''إثْنَعْشَر''', '''ميتَيْن''' — чтобы ты научился их произносить и понимать на слух, а не просто читать 10, 12, 200. В левантийском подростковые числа слитные: '''إثْنَعْشَر''' __itna'shar__ (12), '''أَرْبَعْطَعْشَر''' __arba'tashar__ (14), '''تْمَنْطَعْشَر''' __tmantashar__ (18). Десятки строятся как единицы + وَ + десятки: '''خَمْسة وَعِشْرين''' __khamse w 'ishrin__ (25), '''سَبْعة وَتْمانين''' __saba' w tmanin__ (87). Сотни: '''مِيّة''' __miyye__ (100), '''ميتَيْن''' __mitein__ (200), '''ثْلاثْمِيّة''' __tlat-miyye__ (300), '''أَرْبَعْمِيّة''' __arba'-miyye__ (400).
    **Дешевле / дороже.** '''أَرْخَص''' __arkhas__ и '''أَغْلى''' __aghla__ — сравнительные формы. Модель такая:
    '''هاد الجِّبْنة أَرْخَص بِـ عَشَر لِيرة''' __had il-jibne arkhas bi-'ashar lira__ — Этот сыр дешевле на 10 лир.
    Важен предлог '''بِـ''' __bi-__ — он значит «на эту сумму».
    **Взвесь мне.** '''إِوْزِنّي''' __wzinni__ = взвесь + мне. В магазине левантийский императив + -ни (мне) встречается постоянно: '''عْطيني''' __'tini__ (дай мне), '''إِوْزِنّي''' __wzinni__ (взвесь мне).
    **Нарезать или оставить?** '''أَقَطِّعْها رْفيع وَلّا أُتْرُكْها شَقْفة؟''' __aqatti'ha rfi' walla atrukha sha'fe?__ — Нарезать тонко или оставить куском? '''شَقْفة''' __sha'fe__ — обычное слово для куска сыра, мяса, хлеба.
    **Срок годности.** Два способа сказать:
    - '''تاريخ الانْتِهاء''' __tarikh il-intiha__ — срок годности, формально, на этикетке
    - '''بْيِخْلَص بُكْرا''' __byikhlas bukra__ — заканчивается завтра, разговорно
    '''بْيِضَلّ إثْنَعْشَر يَوْم''' __bidall itna'shar yom__ = годен еще 12 дней.
    **Оплата.** '''المَجْموع''' __il-majmu'__ — итого. '''حَقّه''' __ha''o__ — его цена. '''بِالبِطاقة''' __bil-bitaqa__ — картой, '''كاش''' __cash__ — наличными. Если карта не проходит: '''بِطاقْتي ما عَم بِتْمْرُق''' __bita'ti ma 'am bitmru'__ — моя карта не проходит. Если скидка не применилась: '''الخَصِم ما نِزِل''' __il-khusum ma nizil__ — скидка не «спустилась» / не прошла.


story:
  en:
    - ar: رامي راح عَالسّوبِرْمارْكِت الصُّبْح بَكّير
      en: Rami went to the supermarket early in the morning.
      transliteration: "rami rah 'as-supermarket is-subih bakkir"

    - ar: أَخَذ ميتَيْن غْرام جِبْنة وَرَغيف خُبِز
      en: He took two hundred grams of cheese and a loaf of bread.
      transliteration: "akhad mitein ghram jibne w rghif khubiz"

    - ar: الحَليب كان أَرْخَص بَسّ قَرَّب يِخْلَص
      en: The milk was cheaper but it is about to expire.
      transliteration: "il-halib kan arkhas bass qarrab yikhlas"

    - ar: سَأَل البَيّاع عَن تاريخ الجِّبْنة
      en: He asked the seller about the cheese date.
      transliteration: "sa'al il-bayya' 'an tarikh il-jibne"

    - ar: المَجْموع طِلِع خَمْسة وَسِتّين لِيرة
      en: The total came to sixty-five lira.
      transliteration: "il-majmu' tili' khamse w sittin lira"

    - ar: دَفَع بِالبِطاقة وَرَوَّح عَالبَيْت مَبْسوط
      en: He paid by card and went home happy.
      transliteration: "dafa' bil-bitaqa w rawwah 'al-beit mabsut"

  ru:
    - ar: رامي راح عَالسّوبِرْمارْكِت الصُّبْح بَكّير
      ru: Рами рано утром пошел в супермаркет
      transliteration: "rami rah 'as-supermarket is-subih bakkir"

    - ar: أَخَذ ميتَيْن غْرام جِبْنة وَرَغيف خُبِز
      ru: Взял двести грамм сыра и батон хлеба
      transliteration: "akhad mitein ghram jibne w rghif khubiz"

    - ar: الحَليب كان أَرْخَص بَسّ قَرَّب يِخْلَص
      ru: Молоко было дешевле, но скоро истекает
      transliteration: "il-halib kan arkhas bass qarrab yikhlas"

    - ar: سَأَل البَيّاع عَن تاريخ الجِّبْنة
      ru: Спросил продавца о сроке сыра
      transliteration: "sa'al il-bayya' 'an tarikh il-jibne"

    - ar: المَجْموع طِلِع خَمْسة وَسِتّين لِيرة
      ru: Итого вышло шестьдесят пять лир
      transliteration: "il-majmu' tili' khamse w sittin lira"

    - ar: دَفَع بِالبِطاقة وَرَوَّح عَالبَيْت مَبْسوط
      ru: Заплатил картой и довольный пошел домой
      transliteration: "dafa' bil-bitaqa w rawwah 'al-beit mabsut"


sentences:

- ar: "هاد الجِّبْنة أَرْخَص بِـ عَشَر لِيرة"
  en: "This cheese is cheaper by 10 lira"
  transliteration: "had il-jibne arkhas bi-'ashar lira"
  ru: "Этот сыр дешевле на 10 лир"

- ar: "هاديك الجِّبْنة أَغْلى بِـ إثْنَعْشَر لِيرة"
  en: "That cheese is more expensive by 12 lira"
  transliteration: "hadik il-jibne aghla bi-itna'shar lira"
  ru: "Тот сыр дороже на 12 лир"

- ar: "إِوْزِنّي مِيّة وَخَمْسين غْرام جِبْنة"
  en: "Weigh 150 grams of cheese for me"
  transliteration: "wzinni miyye w khamsin ghram jibne"
  ru: "Взвесьте мне 150 грамм сыра"

- ar: "إِوْزِنّي ميتَيْن وَخَمْسين غْرام مْرْتَدَلّا لَوْ سَمَحْت"
  en: "Weigh 250 grams of ham please"
  transliteration: "wzinni mitein w khamsin ghram murtadella law samaht"
  ru: "Взвесьте 250 грамм ветчины пожалуйста"

- ar: "أَقَطِّعْها رْفيع وَلّا أُتْرُكْها شَقْفة؟"
  en: "Slice it thin or leave it as a piece?"
  transliteration: "aqatti'ha rfi' walla atrukha sha'fe?"
  ru: "Нарезать тонко или оставить куском?"

- ar: "لَوْ سَمَحْت قَطِّع هالشَّقْفة أَرْفَع"
  en: "Please slice this piece thinner"
  transliteration: "law samaht qatti' ha-sh-sha'fe arfa'"
  ru: "Пожалуйста нарежьте этот кусок тоньше"

- ar: "تاريخ الانْتِهاء لَـ تْمَنْطَعْشَر الشَّهْر"
  en: "Expiry date until the 18th"
  transliteration: "tarikh il-intiha la-tmantashar ish-shahir"
  ru: "Срок годности до 18 числа"

- ar: "المُنْتَج بْيِضَلّ إثْنَعْشَر يَوْم كَمان"
  en: "The product is good for 12 more days"
  transliteration: "il-muntaj bidall itna'shar yom kaman"
  ru: "Продукт годен еще 12 дней"

- ar: "هاد الجِّبْنة صالْحة لَـ خَمْسة وَعِشْرين الشَّهْر"
  en: "This cheese is good until the 25th"
  transliteration: "had il-jibne salha la-khamse w 'ishrin ish-shahir"
  ru: "Этот сыр годен до 25 числа"

- ar: "عْطيني ثْلاثْمِيّة غْرام مِن أَطْزَج جِبْنة"
  en: "Give me 300 grams of the freshest cheese"
  transliteration: "'tini tlat-miyye ghram min atzaz jibne"
  ru: "Дайте 300 грамм самого свежего сыра"

- ar: "هاد الحَليب أَرْخَص، بَسّ بْيِخْلَص بُكْرا"
  en: "This milk is cheaper but expires tomorrow"
  transliteration: "had il-halib arkhas, bass byikhlas bukra"
  ru: "Это молоко дешевле, но завтра истекает"

- ar: "الخُبِز مِن طْحين قَمْح كامِل بِالقِسِم أَرْبَعْطَعْشَر"
  en: "Wholemeal bread is in section 14"
  transliteration: "il-khubiz min thin qamh kamil bil-qisim arba'tashar"
  ru: "Хлеб из цельной муки в 14 секции"

- ar: "الرَّغيف الكْبير سَبْعْمِيّة وَخَمْسين غْرام حَقّه تْلَطَّعْشَر لِيرة"
  en: "The big loaf 750 grams costs 13 lira"
  transliteration: "ir-rghif il-kbir saba'-miyye w khamsin ghram ha''o tlatashar lira"
  ru: "Большой батон 750 грамм стоит 13 лир"

- ar: "الرَّغيف الصْغير أَرْبَعْمِيّة غْرام حَقّه تِسَع لِيرة"
  en: "The small loaf 400 grams costs 9 lira"
  transliteration: "ir-rghif is-sghir arba'-miyye ghram ha''o tisa' lira"
  ru: "Маленький батон 400 грамм стоит 9 лир"

- ar: "كيلو تُفّاح حَقّه إثْنَعْشَر لِيرة"
  en: "A kilo of apples costs 12 lira"
  transliteration: "kilo tiffah ha''o itna'shar lira"
  ru: "Килограмм яблок стоит 12 лир"

- ar: "التُّفّاح وَالخُبِز مَع بَعَض واحَد وَعِشْرين لِيرة"
  en: "Apples and bread together are 21 lira"
  transliteration: "it-tiffah wil-khubiz ma' ba'ad wahed w 'ishrin lira"
  ru: "Яблоки и хлеб вместе 21 лира"

- ar: "المَجْموع سَبْعة وَتْمانين لِيرة"
  en: "The total is 87 lira"
  transliteration: "il-majmu' saba' w tmanin lira"
  ru: "Общая сумма покупок 87 лир"

- ar: "بِطاقْتي ما عَم بِتْمْرُق"
  en: "My card is not going through"
  transliteration: "bita'ti ma 'am bitmru'"
  ru: "Моя карта почему-то не проходит"

- ar: "جَرِّب تِمْرُق البِطاقة كَمان مَرّة"
  en: "Try to swipe the card again"
  transliteration: "jarrib timru' il-bitaqa kaman marra"
  ru: "Попробуйте провести карту еще раз"

- ar: "فيني أُقْسُم المَبْلَغ عَلى دَفْعَتَيْن؟"
  en: "Can I split the amount into two payments?"
  transliteration: "fini aqsum il-mablagh 'a daf'atein?"
  ru: "Можно разбить сумму на два платежа?"

- ar: "أَرْبَعين لِيرة كاش وَسَبْعة وَأَرْبَعين بِالبِطاقة"
  en: "40 lira cash and 47 by card"
  transliteration: "arba'in lira cash w saba' w arba'in bil-bitaqa"
  ru: "40 лир наличными и 47 картой"

- ar: "الخَصِم إثْنَعْشَر لِيرة ما نِزِل"
  en: "The 12 lira discount didn't apply"
  transliteration: "il-khusum itna'shar lira ma nizil"
  ru: "Скидка в 12 лир не прошла"

