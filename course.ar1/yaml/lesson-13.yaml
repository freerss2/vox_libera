id: on_road_1
name:
  en: Cars and traffic
  ru: Автомобили и дорожное движение

explanations:
  en: |
    ### Short notes about this topic

    **Msakkra 'alayya** ('''مْسَكْرَة عَلَيَّ'''): Literally means "closed upon me". This is the exact phrase used when another vehicle double-parks or blocks your car in.

    **Kan rah...** ('''كَان رَاح'''): A very handy construction for "almost [happened]". Combined with a verb, e.g., __kan rah yidribni__ = "he was going to hit me" / "he almost hit me".

    **Saff** ('''صَفّ'''): In the Levant, "to park a car" is expressed with the verb __saff__ (literally "to align/line up"), rather than formal terms. A parking space is a __mawqif__.

    **Awlawiyya** ('''أَوْلَوِيَّة'''): Meaning "priority/right of way". At roundabouts (__dawwar__) or unmarked intersections, you can say __'indi al-awlawiyya__ ("I have the right of way").

  ru: |
    ### Краткие заметки по этой теме

    **Msakkra 'alayya** ('''مْسَكْرَة عَلَيَّ'''): Дословно «закрыта на меня». Идеальная фраза для ситуации, когда кто-то подпёр вашу машину или заблокировал выезд.

    **Kan rah...** ('''كَان رَاح'''): Полезнейшая конструкция для значения «чуть не [случилось]». Например: __kan rah yidribni__ — «он чуть не врезался в меня».

    **Saff** ('''صَفّ'''): В разговорном левантийском парковка машины выражается глаголом __saff__ (дословно «ставить в ряд»). Парковочное место — __mawqif__.

    **Awlawiyya** ('''أَوْلَوِيَّة'''): Означает «приоритет / преимущество на дороге». На кольце (__dawwar__) или перекрёстке фраза __'indi al-awlawiyya__ («у меня преимущество») поможет обозначить право проезда.

story:
  en:
    - ar: يَا زَلَمَة، تَطَّلَّع! هَاي السَّيَّارَة مْسَكْرَة عَلَيَّ، مِش قَادِر أَاْخُذ سَيَّارْتِي.
      en: Man, look! This car is blocking me, I can't get my car out.
      transliteration: "Ya zalame, tittalla'! Hay as-sayyara msakkra 'alayya, mish qadir akhud sayyarti."

    - ar: شُو هَالْبَهْدَلَة! إِذَا مَا بْيِجِي هَلَّأ، بَدِّي أَتَّصِل بِالشُّرْطَة.
      en: What a mess! If he doesn't come now, I will call the police.
      transliteration: "Shu hal-bahdala! Idha ma byiji halla', biddi attasil bish-shurta."

    - ar: صَبْرَك شْوَيّ، صَاحِبْهَا بِالصَّيْدَلِيَّة. لَفّ مِن هُونِك وِصَفّ عَالْمَوْقِف.
      en: Be patient, its owner is in the pharmacy. Turn from over there and park in the parking spot.
      transliteration: "Sabrak shwayy, sahibha bis-saydaliyya. Laff min honik w-saff 'al-mawqif."

    - ar: طَيِّب، كَان رَاح يِضْرِبْنِي قَبْل شْوَيّ عَ الدَّوَّار! الشََّارِع مَلْيَان جُنُون.
      en: Okay, but he almost hit me earlier at the roundabout! The street is full of madness.
      transliteration: "Tayyib, kan rah yidribni qabl shwayy 'ad-dawwar! Ash-shari' malyan junun."

  ru:
    - ar: يَا زَلَمَة، تَطَّلَّع! هَاي السَّيَّارَة مْسَكْرَة عَلَيَّ، مِش قَادِر أَاْخُذ سَيَّارْتِي.
      ru: Дружище, посмотри! Эта машина заблокировала меня, я не могу выехать.
      transliteration: "Ya zalame, tittalla'! Hay as-sayyara msakkra 'alayya, mish qadir akhud sayyarti."

    - ar: شُو هَالْبَهْدَلَة! إِذَا مَا بْيِجِي هَلَّأ، بَدِّي أَتَّصِل بِالشُّرْطَة.
      ru: Что за безобразие! Если он сейчас не прийдёт, я вызову полицию.
      transliteration: "Shu hal-bahdala! Idha ma byiji halla', biddi attasil bish-shurta."

    - ar: صَبْرَك شْوَيّ، صَاحِبْهَا بِالصَّيْدَلِيَّة. لَفّ مِن هُونِك وِصَفّ عَالْمَوْقِف.
      ru: Потерпи немного, хозяин в аптеке. Поверни вон там и припаркуйся на парковке.
      transliteration: "Sabrak shwayy, sahibha bis-saydaliyya. Laff min honik w-saff 'al-mawqif."

    - ar: طَيِّب، كَان رَاح يِضْرِبْنِي قَبْل شْوَيّ عَ الدَّوَّار! الشََّارِع مَلْيَان جُنُون.
      ru: Ладно, но он чуть не стукнул меня чуть раньше на кольце! На улице полный беспредел.
      transliteration: "Tayyib, kan rah yidribni qabl shwayy 'ad-dawwar! Ash-shari' malyan junun."

sentences:
- en: this car blocked me
  ar: هَاي السَّيَّارَة مْسَكْرَة عَلَيَّ
  transliteration: "hay as-sayyara msakkra 'alayya"
  ru: эта машина заблокировала меня

- en: i will call the police now
  ar: هَلَّأ بَدِّي أَتَّصِل بِالشُّرْطَة
  transliteration: "halla' biddi attasil bish-shurta"
  ru: я сейчас вызову полицию

- en: look where you are driving
  ar: تَطَّلَّع وِين عَمْ تْسُوق
  transliteration: "tittalla' wen 'am tsut"
  ru: смотри куда едешь

- en: let me pass i have the right of way
  ar: مَرِّقْنِي أَنَا عِنْدِي الأَوْلَوِيَّة
  transliteration: "marriqni ana 'indi al-awlawiyya"
  ru: пропусти меня у меня преимущество

- en: drive faster do not hold everyone up
  ar: سُوق أَسْرَع لا تْعَطِّل الْكُلّ
  transliteration: "suq asra' la t'attil il-kull"
  ru: проезжай быстрее не задерживай всех

- en: he almost hit me
  ar: كَان رَاح يِضْرِبْنِي
  transliteration: "kan rah yidribni"
  ru: он чуть не стукнул меня

- en: his tire went flat
  ar: عَجَلْتُو بَنَشَرَت
  transliteration: "'ajalto banasharat"
  ru: у него спустило колесо

- en: turn right at the intersection
  ar: لَفّ يَمِين عَ التَّقَاطُع
  transliteration: "laff yamin 'at-taqatu'"
  ru: поверни направо на перекрёстке

- en: stop at the red traffic light
  ar: إِقَف عَ الإِشَارَة الْحَمْرَا
  transliteration: "iqaf 'al-ishara il-hamra"
  ru: остановись на красный светофор

- en: slow down before the turn
  ar: هَدِّي قَبْل اللَّفَّة
  transliteration: "haddi qabl al-laffa"
  ru: сбавь скорость перед поворотом

- en: turn at the roundabout
  ar: لَفّ عَ الدَّوَّار
  transliteration: "laff 'ad-dawwar"
  ru: поверни на круговом движении

- en: the big truck is slow
  ar: الشَّاحْنَة الْكْبِيرَة بَطِيئَة
  transliteration: "ash-shahna il-kbira bati'a"
  ru: большой грузовик медленный

- en: watch out for the motorcycle
  ar: دِير بَالَك مِن الْمُوتُور
  transliteration: "dir balak min il-motor"
  ru: берегись мотоцикла

- en: the bicycle is on the right
  ar: البِسْكِلِيت عَ الْيَمِين
  transliteration: "al-bisklet 'al-yamin"
  ru: велосипед справа

- en: this parking is paid
  ar: هَاد الْمَوْقِف بِمَصَارِي
  transliteration: "had il-mawqif bi-masari"
  ru: эта стоянка платная

- en: is there a free parking spot here
  ar: فِي مَوْقِف فَاضِي هُون؟
  transliteration: "fi mawqif fadi hon?"
  ru: здесь есть свободное парковочное место

- en: entry is forbidden here
  ar: الدُّخُول مَمْنُوع هُون
  transliteration: "ad-dukhul mamnu' hon"
  ru: въезд запрещён здесь

- en: look at the road sign
  ar: تَطَّلَّع عَ الِافْتَة الشََّارِع
  transliteration: "tittalla' 'a-laftat ash-shari'"
  ru: посмотри на дорожный указатель

- en: fill it up full tank please
  ar: فَلِّلْهَا لَوْ سَمَحْت
  transliteration: "fallilha law samaht"
  ru: заправь полный бак пожалуйста

- en: where is the nearest gas station
  ar: وِين أَقْرَب مَحَطَّة بَنْزِين؟
  transliteration: "wen aqrab mahattat banzin?"
  ru: где ближайшая заправка

- en: please stop after the bus stop
  ar: إِقَف لَوْ سَمَحْت بَعِد مَوْقِف الْبَاص
  transliteration: "iqaf law samaht ba'id mawqif il-bas"
  ru: останови пожалуйста после автобусной остановки

- en: what is the direction of traffic on this street
  ar: شُو اتِّجَاه السَّيْر بِهَاد الشََّارِع؟
  transliteration: "shu ittijah as-sayr bi-had ash-shari'?"
  ru: какое направление движения на этой улице

- en: you are driving in the wrong direction
  ar: عَمْ تْسُوق بِالاتِّجَاه الْغَلَط
  transliteration: "'am tsuq bil-ittijah il-ghalat"
  ru: ты едешь в неправильном направлении


