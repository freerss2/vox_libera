sentences:
- en: she works as a tailor in the workshop
  ar: بِتِشْتِغِلْ خَيَّاطَة بِالْوَرْشَة
  transliteration: bitishtighil khayyata bil-warsha
  ru: она работает портной в мастерской
- en: the student studies at the faculty of arts
  ar: اَلطَّالْبَة بِتِدْرُسْ بِكُلِّيَّةِ الْفُنُون
  transliteration: at-talba bitidrus bi-kulliyyat il-funun
  ru: студентка учится на факультете искусств
- en: the mathematician works in the academy
  ar: عَالِمْ الرِّيَاضِيَّات بْيِشْتِغِلْ بِالْأَكَادِيمِيَّة
  transliteration: alim ir-riyadiyyat byishtighil bil-akadimiyya
  ru: математик работает в академии
- en: the designer is making a project in the studio
  ar: اَلْمُصَمِّمْ بْيِعْمَلْ مَشْرُوعْ بِالِاسْتُودْيُو
  transliteration: il-musammim byi'mal mashru' bil-istudyu
  ru: дизайнер создает проект в студии
- en: the teacher explains the lesson in class
  ar: اَلْمُعَلِّمْ بْيِشْرَحْ الدَّرْسْ بِالصَّفّ
  transliteration: il-m'allim byishrah id-dars bis-saff
  ru: учитель объясняет урок в классе
- en: i love cinema and art
  ar: بْحِبّْ السِّينَمَا وَالْفَنّ
  transliteration: bhibb is-sinama wal-fann
  ru: я люблю кино и искусство
- en: she is sewing a dress from beautiful fabric
  ar: بِتْخَيِّطْ فُسْتَانْ مِنْ قُمَاشْ حِلُو
  transliteration: bitkhayyit fustan min qumash hilu
  ru: она шьет платье из красивой ткани
- en: we study math at the university
  ar: بْنِدْرُسْ رِيَاضِيَّات بِالْجَامْعَة
  transliteration: bnidrus riyadiyyat bil-jam'a
  ru: мы изучаем математику в университете
- en: this workshop is very big
  ar: هَايْ الْوَرْشَة كْبِيرَة كْتِيرْ
  transliteration: hayy il-warsha kbira ktir
  ru: эта мастерская очень большая
- en: the student has an exam tomorrow
  ar: اَلطَّالْبَة عِنْدْهَا امْتِحَانْ بُكْرَة
  transliteration: at-talba indha mtihan bukra
  ru: у студентки завтра экзамен
- en: the math professor writes numbers
  ar: أُسْتَاذْ الرِّيَاضِيَّات بْيِكْتُبْ الْأَرْقَامْ
  transliteration: ustaz ir-riyadiyyat byiktub il-arqam
  ru: профессор математики пишет цифры
- en: the academy is open for students
  ar: اَلْأَكَادِيمِيَّة مَفْتُوحَة لَلطُّلَّاب
  transliteration: il-akadimiyya maftuha lat-tullab
  ru: академия открыта для студентов
- en: the designer works on a new blueprint
