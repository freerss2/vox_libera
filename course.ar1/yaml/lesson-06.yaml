id: airport_1
name:
  en: Airport 1
  ru: Аэропорт 1
explanations:
  en: |
    ### Lesson Objective
    As the saying goes, "language unites." If you're planning a trip or simply meeting friends from abroad, the materials in this lesson will help you communicate about travel.

    ### Explanations
    Shanta '''شنطة''': The most common word for any bag or suitcase. Carry-on luggage is more often called shanta id (handbag) in conversation than the formal haqibat yad.

    Afsh '''عفش''': A very popular word for luggage in general (things you check in).

    Fadi / Mahjuz: These two words will save you when you need to figure out if a seat is free in a lounge or on a plane.
  ru: |
    ### Цель урока
    Как известно "язык объединяет". Если вы задумаете путешествовать или просто встречаете знакомых из-за границы, материалы этого урока помогут вам в общении на тему путешествий.

    ### Пояснения
    Шанта '''شنطة''': Самое ходовое слово для любой сумки или чемодана. Ручную кладь в разговоре чаще называют Шантат ид (сумка для руки), чем формальным хакибат яд.

    Афш '''عفش''': Очень популярное слово для обозначения багажа в целом (вещей, которые вы сдаете).

    Фади / Махджуз: Эти два слова спасут вас, если нужно понять, свободно ли место в зале ожидания или в самолете.

story:
  en:
    - ar: رِحْلْتِي بَكِّير وِلَازِم أَرُوح عَلَى الْمَطَار هَلَّق.
      en: My flight is early and I must go to the airport now.
      transliteration: Rihlati bakir wa lazim aruh alal-matar hallaq.
    - ar: وَيْن الْمَقْعَد تَبَعِي؟ هَاد الْكُرْسِي فَاضِي وَلَّا مَحْجُوز؟
      en: Where is my seat? Is this chair empty or reserved?
      transliteration: "Wayn al-maq'ad tabai? Had al-kursi fadi walla mahjuz?"
    - ar: بِدِّي بِطَاقَة الصُّعُود وَجَوَاز السَّفَر لَوْ سَمَحْت.
      en: I need the boarding pass and the passport, please.
      transliteration: "Biddi bitaqat as-su'ud wa jawaz as-safar law samaht."
    - ar: عِنْدِي وَزْن زَايِد بِالشَّنْطَة الْكَبِيرَة وِبِدِّي أَدْفَع هُون.
      en: I have excess weight in the big bag and I want to pay here.
      transliteration: Indi wazn zayid bish-shanta al-kabira wa biddi adfa hon.
    - ar: رِحْلَة سَعِيدَة! جَارِي الْعَزِيز كَمَان بْيِسَافِر مَعِي الْيَوْم.
      en: Have a nice flight! My dear neighbor is also traveling with me today.
      transliteration: "Rihla sa'ida! Jari al-aziz kaman byisafir ma'i al-yom."
  ru:
    - ar: رِحْلْتِي بَكِّير وِلَازِم أَرُوح عَلَى الْمَطَار هَلَّق.
      ru: Мой рейс рано утром, и мне нужно ехать в аэропорт прямо сейчас.
      transliteration: Rihlati bakir wa lazim aruh alal-matar hallaq.
    - ar: وَيْن الْمَقْعَد تَبَعِي؟ هَاد الْكُرْسِي فَاضِي وَلَّا مَحْجُوز؟
      ru: Где моё место? Это сиденье свободно или занято?
      transliteration: "Wayn al-maq'ad tabai? Had al-kursi fadi walla mahjuz?"
    - ar: بِدِّي بِطَاقَة الصُّعُود وَجَوَاز السَّفَر لَوْ سَمَحْت.
      ru: Мне нужен ваш посадочный талон и загранпаспорт, пожалуйста.
      transliteration: "Biddi bitaqat as-su'ud wa jawaz as-safar law samaht."
    - ar: عِنْدِي وَزْن زَايِد بِالشَّنْطَة الْكَبِيرَة وِبِدِّي أَدْفَع هُون.
      ru: У меня перевес в большом чемодане, и я хочу оплатить здесь.
      transliteration: Indi wazn zayid bish-shanta al-kabira wa biddi adfa hon.
    - ar: رِحْلَة سَعِيدَة! جَارِي الْعَزِيز كَمَان بْيِسَافِر مَعِي الْيَوْم.
      ru: Счастливого полёта! Мой дорогой сосед тоже летит со мной сегодня.
      transliteration: "Rihla sa'ida! Jari al-aziz kaman byisafir ma'i al-yom."

