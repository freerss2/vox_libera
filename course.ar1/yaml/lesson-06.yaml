sentences:
- en: where is the airport
  ar: وِين الْمَطَار؟
  transliteration: wen il-matar?
  ru: где аэропорт
- en: my flight is late today
  ar: رِحْلْتِي مْتَأَخِّرَة الْيَوْم
  transliteration: "rihlti mt'akhkhra il-yom"
  ru: мой рейс сегодня задерживается
- en: i want the boarding pass please
  ar: بِدِّي بِطَاقَة الصُّعُود لَوْ سَمَحْت
  transliteration: "biddi bitaqat is-su'ud law samaht"
  ru: я хочу посадочный талон пожалуйста
- en: where is the boarding gate
  ar: وِين بَوَّابَة الصُّعُود؟
  transliteration: "wen bawwabat is-su'ud?"
  ru: где выход на посадку
- en: i have excess weight in the suitcase
  ar: عِنْدِي وَزْن زَايِد بِشَنْتَة السَّفَر
  transliteration: "'indi wazn zayid bish-shantat is-safar"
  ru: у меня перевес в чемодане
- en: the hand luggage is here
  ar: شَنْتَة الإِيد هُون
  transliteration: shantat il-id hon
  ru: ручная кладь здесь
- en: the security officer checks the passport
  ar: ضَابِط الأَمْن بْيِفْحَص جَوَاز السَّفَر
  transliteration: dabit il-amn byifhas jawaz is-safar
  ru: офицер безопасности проверяет паспорт
- en: there is a big queue in customs
  ar: فِيه دَوْر كْبِير بِالْجَمَارِك
  transliteration: fih dor kbir bil-jamarik
  ru: на таможне большая очередь
- en: i wait for my luggage here
  ar: بَسْتَنَّى الْعَفْش تَبَعِي هُون
  transliteration: "bastanna il-'afsh taba'i hon"
  ru: я жду свой багаж здесь
- en: is this seat free
  ar: هَاد الْمَقْعَد فَاضِي؟
  transliteration: "had il-maq'ad fadi?"
  ru: это место свободное
- en: is this chair free
  ar: هَاد الْكُرْسِي فَاضِي؟
  transliteration: had il-kursi fadi?
  ru: это кресло свободное
- en: this seat next to me is reserved
  ar: هَاد الْمَقْعَد جَنْبِي مَحْجُوز
  transliteration: "had il-maq'ad janbi mahjuz"
  ru: это место рядом со мной занято
- en: i want a seat next to the window
  ar: بِدِّي مَقْعَد جَنْب الشُّبَّاك
  transliteration: "biddi maq'ad janb ish-shubbak"
  ru: я хочу место у окна
- en: where is the aisle seat
  ar: وِين الْمَقْعَد بِالْمَمَرّ؟
  transliteration: "wen il-maq'ad bil-mamarr?"
  ru: где место у прохода
- en: i fly to russia tomorrow
  ar: بَسَافِر عَ رُوسْيَا بُكْرَة
  transliteration: "basafir 'a-rusiya bukra"
  ru: я лечу в россию завтра
- en: where is the customs inspection
  ar: وِين تَفْتِيش الْجَمَارِك؟
  transliteration: wen taftish il-jamarik?
  ru: где таможенный досмотр
- en: the plane is very big
  ar: الطَّيَّارَة كْبِيرَة كْتِير
  transliteration: it-tayyara kbira ktir
  ru: самолет очень большой
- en: the pilot is in the plane now
  ar: الطَّيَّار بِالطَّيَّارَة هَلَّأ
  transliteration: "it-tayyar bit-tayyara halla'"
  ru: пилот сейчас в самолете
- en: where is my suitcase
  ar: وِين شَنْتَة السَّفَر تَبَعْتِي؟
  transliteration: "wen shantat is-safar taba'ti?"
  ru: где мой чемодан
- en: i am late for the flight
  ar: أَنَا مْتَأَخِّر عَ الرِّحْلَة
  transliteration: "ana mt'akhkhir 'a-r-rihle"
  ru: я опаздываю на рейс
- en: the delay is from the airport
  ar: التَّأْخِير مِنْ الْمَطَار
  transliteration: "it-ta'khir min il-matar"
  ru: задержка из-за аэропорта
- en: show me the passport please
  ar: وَرَّجِينِي جَوَاز السَّفَر لَوْ سَمَحْت
  transliteration: warrajini jawaz is-safar law samaht
  ru: покажи мне паспорт пожалуйста
- en: we wait in the queue now
  ar: بْنَسْتَنَّى بِالدَّوْر هَلَّأ
  transliteration: "bnastanna bid-dor halla'"
  ru: мы ждем в очереди сейчас